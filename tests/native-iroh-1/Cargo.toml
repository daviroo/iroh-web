[package]
name = "iroh-web-interop-peer"
version = "0.0.0"
edition = "2024"
publish = false

# Separate lockfile: never change the browser crate's iroh 1.2 dependency graph.
[workspace]

[dependencies]
anyhow = "1"
iroh = "=1.0.0"
iroh-tickets = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
